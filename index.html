<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer Pedido - Menú Interactivo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        .mesa-badge { text-align: center; background: #e7f5e4; color: #075e54; font-weight: bold; margin-bottom: 15px; font-size: 15px; padding: 6px; border-radius: 5px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 15px; color: #555; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 14px; }
        .seccion-titulo { font-size: 15px; color: #075e54; border-bottom: 2px solid #25d366; margin-top: 20px; margin-bottom: 10px; padding-bottom: 3px; font-weight: bold; }
        .item-menu { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #f9f9f9; padding: 8px 12px; border-radius: 8px; border: 1px solid #eee; }
        .item-info { font-size: 13px; color: #333; }
        .item-info span { display: block; font-size: 11px; color: #777; }
        .controles { display: flex; align-items: center; gap: 8px; }
        .controles button { background: #075e54; color: white; border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .controles span { font-weight: bold; width: 20px; text-align: center; font-size: 14px; }
        .total-box { background: #e7f5e4; padding: 12px; border-radius: 8px; margin-top: 20px; text-align: right; font-size: 16px; font-weight: bold; color: #075e54; }
        button.btn-enviar { width: 100%; padding: 12px; background: #25d366; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; border-radius: 8px; font-size: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛒 Menú Interactivo</h2>
        <div class="mesa-badge" id="badge-mesa">📍 Mesa: 1</div>
        
        <div id="mensaje-estado" style="text-align:center; font-size:12px; color:#e67e22; margin-bottom:10px;">Cargando menú del servidor...</div>

        <form id="formPedido" onsubmit="enviarPedido(event)">
            <label for="nombre">Tu Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos" required>

            <div id="contenedor-menu"></div>

            <div class="total-box">
                Total: $<span id="total_texto">0.00</span>
            </div>

            <button type="submit" class="btn-enviar">Realizar Pedido 🚀</button>
        </form>
    </div>

    <script>
        // CAMBIA ESTA URL por la dirección de tu servidor Python (ej: IP pública o enlace de Ngrok)
        const URL_SERVIDOR = "http://localhost:8081"; 
        
        let menuData = {};
        let cantidades = {};
        let precios = {};
        let nombresItems = {};

        // Obtener número de mesa desde la URL (ej: tuweb.github.io/?mesa=2)
        const urlParams = new URLSearchParams(window.location.search);
        const mesaId = urlParams.get('mesa') || '1';
        document.getElementById('badge-mesa').innerText = `📍 Mesa: ${mesaId}`;

        async function cargarMenu() {
            try {
                let response = await fetch(`${URL_SERVIDOR}/api/menu`);
                menuData = await response.json();
                
                let htmlMenu = "";
                let secciones = {};

                for (let clave in menuData) {
                    let info = menuData[clave];
                    precios[clave] = info.precio;
                    nombresItems[clave] = info.nombre;
                    cantidades[clave] = 0;

                    if (!secciones[info.seccion]) secciones[info.seccion] = [];
                    secciones[info.seccion].push({clave, ...info});
                }

                for (let sec in secciones) {
                    htmlMenu += `<div class="seccion-titulo">${sec}</div>`;
                    secciones[sec].forEach(item => {
                        htmlMenu += `
                        <div class="item-menu">
                            <div class="item-info">${item.emoji} ${item.nombre}<span>$${item.precio.toFixed(2)}</span></div>
                            <div class="controles">
                                <button type="button" onclick="cambiarCantidad('${item.clave}', -1)">-</button>
                                <span id="cant_${item.clave}">0</span>
                                <button type="button" onclick="cambiarCantidad('${item.clave}', 1)">+</button>
                            </div>
                        </div>`;
                    });
                }

                document.getElementById('contenedor-menu').innerHTML = htmlMenu;
                document.getElementById('mensaje-estado').style.display = 'none';
            } catch (error) {
                document.getElementById('mensaje-estado').innerText = "⚠️ Error: No se pudo conectar con el servidor central.";
                document.getElementById('mensaje-estado').style.color = "red";
            }
        }

        function cambiarCantidad(item, cambio) {
            cantidades[item] += cambio;
            if (cantidades[item] < 0) cantidades[item] = 0;
            document.getElementById('cant_' + item).innerText = cantidades[item];
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            for (let item in cantidades) {
                total += cantidades[item] * precios[item];
            }
            document.getElementById('total_texto').innerText = total.toFixed(2);
        }

        async function enviarPedido(event) {
            event.preventDefault();
            let resumen = [];
            let total = 0;

            for (let item in cantidades) {
                if (cantidades[item] > 0) {
                    let subtotal = cantidades[item] * precios[item];
                    resumen.push(cantidades[item] + "x " + nombresItems[item] + " ($" + subtotal.toFixed(2) + ")");
                    total += subtotal;
                }
            }

            if (total === 0) {
                alert("Selecciona al menos un producto.");
                return;
            }

            let formData = new URLSearchParams();
            formData.append('mesa', mesaId);
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('detalle_pedido', resumen.join(', '));
            formData.append('total_pagar', total.toFixed(2));

            try {
                let res = await fetch(`${URL_SERVIDOR}/api/enviar_pedido`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    alert("¡Pedido enviado a cocina con éxito! 🎉");
                    location.reload();
                } else {
                    alert("Hubo un problema al enviar el pedido.");
                }
            } catch (e) {
                alert("Error de conexión con el servidor.");
            }
        }

        cargarMenu();
    </script>
</body>
</html>
