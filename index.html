<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Python en el Navegador</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            resize: vertical;
            outline: none;
            box-sizing: border-box;
        }
        textarea:focus { border-color: #38bdf8; }
        .toolbar {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #runBtn { background-color: #22c55e; color: white; }
        #runBtn:hover { background-color: #16a34a; }
        #stopBtn { background-color: #ef4444; color: white; }
        #stopBtn:hover { background-color: #dc2626; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        
        .output-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        pre {
            flex-grow: 1;
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #cbd5e1;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .status {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <h2>Editor Python Online</h2>
    
    <div class="container">
        <textarea id="codeEditor" placeholder="Escribe tu código Python aquí...&#10;print('¡Hola desde Python!')">print("¡Hola Mundo!")
for i in range(5):
    print(f"Número: {i}")</textarea>
        
        <div class="toolbar">
            <button id="runBtn" onclick="runPython()">▶ Run</button>
            <button id="stopBtn" onclick="stopPython()" disabled>⏹ Stop</button>
        </div>

        <div class="output-container">
            <div class="status" id="statusText">Cargando intérprete de Python (Pyodide)...</div>
            <pre id="output">Espera un momento mientras se inicializa el entorno...</pre>
        </div>
    </div>

    <script>
        let worker = null;
        const runBtn = document.getElementById("runBtn");
        const stopBtn = document.getElementById("stopBtn");
        const outputPre = document.getElementById("output");
        const statusText = document.getElementById("statusText");
        const codeEditor = document.getElementById("codeEditor");

        // Código que correrá dentro del Web Worker para aislar la ejecución
        const workerCode = `
            importScripts("https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js");
            
            let pyodideReady = false;

            async function init() {
                self.pyodide = await loadPyodide();
                pyodideReady = true;
                postMessage({ type: 'ready' });
            }
            init();

            onmessage = async (e) => {
                if (!pyodideReady) return;
                if (e.data.type === 'run') {
                    const code = e.data.code;
                    try {
                        // Redirigir stdout para capturar los prints
                        self.pyodide.runPython(\`
                            import sys
                            import io
                            sys.stdout = io.StringIO()
                        \`);
                        
                        await self.pyodide.runPythonAsync(code);
                        
                        let stdout = self.pyodide.runPython("sys.stdout.getvalue()");
                        postMessage({ type: 'output', data: stdout });
                    } catch (err) {
                        postMessage({ type: 'output', data: "Error: " + err.message });
                    }
                }
            };
        `;

        function createWorker() {
            const blob = new Blob([workerCode], { type: "application/javascript" });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                if (e.data.type === 'ready') {
                    statusText.textContent = "Listo para ejecutar";
                    outputPre.textContent = "Entorno Python listo.";
                    runBtn.disabled = false;
                } else if (e.data.type === 'output') {
                    outputPre.textContent = e.data.data;
                    resetUI();
                }
            };
        }

        // Inicializar el worker al cargar la página
        createWorker();

        function runPython() {
            outputPre.textContent = "Ejecutando...";
            statusText.textContent = "Ejecutando código...";
            runBtn.disabled = true;
            stopBtn.disabled = false;

            const code = codeEditor.value;
            worker.postMessage({ type: 'run', code: code });
        }

        function stopPython() {
            if (worker) {
                worker.terminate(); // Mata el hilo de ejecución inmediatamente
                outputPre.textContent += "\n[Proceso detenido por el usuario]";
                statusText.textContent = "Ejecución detenida.";
                resetUI();
                createWorker(); // Reinicia el worker para futuras ejecuciones
            }
        }

        function resetUI() {
            runBtn.disabled = false;
            stopBtn.disabled = true;
            statusText.textContent = "Listo";
        }
    </script>
</body>
</html>
