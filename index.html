<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacer Pedido - Mesa 1 (Espejo)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        .mesa-badge { text-align: center; background: #e7f5e4; color: #075e54; font-weight: bold; margin-bottom: 15px; font-size: 15px; padding: 6px; border-radius: 5px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 15px; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; font-size: 14px; }
        
        .seccion-titulo { font-size: 15px; color: #075e54; border-bottom: 2px solid #25d366; margin-top: 20px; margin-bottom: 10px; padding-bottom: 3px; font-weight: bold; }
        .item-menu { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: #f9f9f9; padding: 8px 12px; border-radius: 8px; border: 1px solid #eee; }
        .item-info { font-size: 13px; color: #333; }
        .item-info span { display: block; font-size: 11px; color: #777; }
        .controles { display: flex; align-items: center; gap: 8px; }
        .controles button { background: #075e54; color: white; border: none; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .controles button:hover { background: #128c7e; }
        .controles span { font-weight: bold; width: 20px; text-align: center; font-size: 14px; }

        .total-box { background: #e7f5e4; padding: 12px; border-radius: 8px; margin-top: 20px; text-align: right; font-size: 16px; font-weight: bold; color: #075e54; }
        button.btn-enviar { width: 100%; padding: 12px; background: #25d366; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; border-radius: 8px; font-size: 15px; transition: background 0.3s; }
        button.btn-enviar:hover { background: #128c7e; }
        .admin-link { display: block; text-align: center; margin-top: 15px; color: #075e54; text-decoration: none; font-size: 13px; cursor: pointer; }
        .admin-link:hover { text-decoration: underline; }

        /* Vistas de Pantalla */
        .vista { display: none; }
        .vista.activa { display: block; }
        
        /* Estilos del Panel Admin dentro del HTML */
        .pedido-card { background: #f9f9f9; border-left: 5px solid #25d366; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .pedido-card p { margin: 5px 0; color: #333; }
        .tag-mesa { background: #075e54; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .tag-total { background: #e7f5e4; color: #075e54; padding: 2px 8px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .tag-hora { font-size: 12px; color: #666; float: right; }
    </style>
</head>
<body>

    <!-- VISTA 1: MENÚ Y PEDIDOS (CLIENTE) -->
    <div id="vista-cliente" class="card vista activa">
        <h2>🛒 Menú Interactivo</h2>
        <div class="mesa-badge">📍 Mesa: <span id="lbl-mesa">1</span></div>
        
        <form id="formPedido" onsubmit="enviarPedido(event)">
            <label for="nombre">Tu Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Carlos" required>

            <div id="contenedor-menu-dinamico">
                <!-- Se inyecta dinámicamente el menú desde JavaScript -->
            </div>

            <div class="total-box">
                Total: $<span id="total_texto">0.00</span>
            </div>

            <button type="submit" class="btn-enviar">Realizar Pedido 🚀</button>
        </form>
        <a class="admin-link" onclick="verificarAdmin()">📊 Ver Panel de Pedidos (Admin)</a>
    </div>

    <!-- VISTA 2: ÉXITO DE PEDIDO -->
    <div id="vista-exito" class="card vista" style="text-align: center;">
        <h2 style="color: #25d366;">¡Pedido Recibido! 🎉</h2>
        <p>Tu selección ha sido enviada a cocina con éxito.</p>
        <button class="btn-enviar" onclick="volverMenu()">Volver al menú</button>
    </div>

    <!-- VISTA 3: PANEL DE ADMINISTRACIÓN -->
    <div id="vista-admin" class="card vista" style="max-width: 600px;">
        <h2 style="color: #075e54;">🔒 Panel de Control</h2>
        <h3 style="color: #333; font-size: 14px;">Pedidos Registrados en Vivo:</h3>
        
        <div id="contenedor-pedidos-admin" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
            <p style="text-align: center; color: #777;">No hay pedidos todavía.</p>
        </div>

        <button class="btn-enviar" style="background: #ff4d4d; margin-bottom: 10px;" onclick="reiniciarPedidos()">🗑️ Borrar Todos los Pedidos</button>
        <a class="admin-link" onclick="volverMenu()">⬅ Ir al menú principal</a>
    </div>

    <script>
        // --- BASE DE DATOS LOCAL Y MENÚ ---
        const precios = {
            "hamburguesa": 5.00,
            "hotdog": 3.50,
            "refresco": 1.50,
            "jugo": 2.00,
            "tres_leches": 3.00
        };

        const nombresItems = {
            "hamburguesa": "Hamburguesa Clásica",
            "hotdog": "Hot Dog Especial",
            "refresco": "Refresco Cola 500ml",
            "jugo": "Jugo Natural de Fresa",
            "tres_leches": "Porción de Tres Leches"
        };

        const menuData = [
            { clave: "hamburguesa", nombre: "Hamburguesa Clásica", precio: 5.00, seccion: "Platos Principales", emoji: "🍔" },
            { clave: "hotdog", nombre: "Hot Dog Especial", precio: 3.50, seccion: "Platos Principales", emoji: "🌭" },
            { clave: "refresco", nombre: "Refresco Cola 500ml", precio: 1.50, seccion: "Bebidas", emoji: "🥤" },
            { clave: "jugo", nombre: "Jugo Natural de Fresa", precio: 2.00, seccion: "Bebidas", emoji: "🧃" },
            { clave: "tres_leches", nombre: "Porción de Tres Leches", precio: 3.00, seccion: "Postres", emoji: "🍰" }
        ];

        let cantidades = { "hamburguesa": 0, "hotdog": 0, "refresco": 0, "jugo": 0, "tres_leches": 0 };
        let listaPedidosGlobal = []; // Simula la BD de pedidos en memoria

        // Renderizar el menú dinámicamente al cargar
        function inicializarMenu() {
            let contenedor = document.getElementById('contenedor-menu-dinamico');
            let htmlHTML = "";
            let secciones = {};

            menuData.forEach(item => {
                if (!secciones[item.seccion]) secciones[item.seccion] = [];
                secciones[item.seccion].push(item);
            });

            for (let sec in secciones) {
                htmlHTML += `<div class="seccion-titulo">${sec}</div>`;
                secciones[sec].forEach(i => {
                    htmlHTML += `
                    <div class="item-menu">
                        <div class="item-info">${i.emoji} ${i.nombre}<span>$${i.precio.toFixed(2)}</span></div>
                        <div class="controles">
                            <button type="button" onclick="cambiarCantidad('${i.clave}', -1)">-</button>
                            <span id="cant_${i.clave}">0</span>
                            <button type="button" onclick="cambiarCantidad('${i.clave}', 1)">+</button>
                        </div>
                    </div>`;
                });
            }
            contenedor.innerHTML = htmlHTML;
        }

        function cambiarCantidad(item, cambio) {
            cantidades[item] += cambio;
            if (cantidades[item] < 0) cantidades[item] = 0;
            document.getElementById('cant_' + item).innerText = cantidades[item];
            calcularTotal();
        }

        function calcularTotal() {
            let total = 0;
            for (let item in cantidades) {
                total += cantidades[item] * precios[item];
            }
            document.getElementById('total_texto').innerText = total.toFixed(2);
        }

        function enviarPedido(event) {
            event.preventDefault();
            let nombre = document.getElementById('nombre').value;
            let resumen = [];
            let total = 0;

            for (let item in cantidades) {
                if (cantidades[item] > 0) {
                    let subtotal = cantidades[item] * precios[item];
                    resumen.push(cantidades[item] + "x " + nombresItems[item] + " ($" + subtotal.toFixed(2) + ")");
                    total += subtotal;
                }
            }

            if (total === 0) {
                alert("Por favor selecciona al menos un producto antes de enviar el pedido.");
                return;
            }

            let horaActual = new Date().toLocaleTimeString();

            // Guardar en la lista global simulada
            listaPedidosGlobal.push({
                mesa: "1",
                nombre: nombre,
                detalle: resumen.join(', '),
                total: total.toFixed(2),
                hora: horaActual
            });

            // Resetear cantidades
            for (let item in cantidades) { cantidades[item] = 0; }
            document.getElementById('formPedido').reset();
            calcularTotal();
            inicializarMenu();

            // Mostrar pantalla de éxito
            cambiarVista('vista-exito');
        }

        function cambiarVista(idVista) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
            document.getElementById(idVista).classList.add('activa');
        }

        function volverMenu() {
            cambiarVista('vista-cliente');
        }

        function verificarAdmin() {
            let usuario = prompt("Usuario de Admin:");
            let pass = prompt("Contraseña de Admin (1234):");
            
            if (usuario === "admin" && pass === "1234") {
                actualizarPanelAdmin();
                cambiarVista('vista-admin');
            } else {
                alert("Credenciales incorrectas ❌");
            }
        }

        function actualizarPanelAdmin() {
            let contenedor = document.getElementById('contenedor-pedidos-admin');
            if (listaPedidosGlobal.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; color: #777;">No hay pedidos registrados todavía. 📭</p>';
                return;
            }

            let html = "";
            // Mostrar del más reciente al más antiguo
            [...listaPedidosGlobal].reverse().forEach(p => {
                html += `
                <div class="pedido-card">
                    <p><span class="tag-mesa">Mesa ${p['mesa']}</span> <span class="tag-hora">🕒 ${p['hora']}</span> <span style="float: right;" class="tag-total">Total: $${p['total']}</span></p>
                    <p><strong>👤 Cliente:</strong> ${p['nombre']}</p>
                    <p><strong>🛍️ Detalle:</strong> ${p['detalle']}</p>
                </div>`;
            });
            contenedor.innerHTML = html;
        }

        function reiniciarPedidos() {
            if (confirm("¿Estás seguro de borrar todos los pedidos?")) {
                listaPedidosGlobal = [];
                actualizarPanelAdmin();
                alert("Pedidos reiniciados 🗑️");
            }
        }

        // Cargar menú al iniciar
        window.onload = inicializarMenu;
    </script>
</body>
</html>
